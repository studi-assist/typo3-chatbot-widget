<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lokaler iframe-Platzhalter</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #f7f9fc; color: #34404d; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 28rem; padding: 24px; text-align: center; }
    h1 { font-size: 22px; color: #003865; }
    small { color: #667585; }
  </style>
</head>
<body>
  <main>
    <h1>Lokale Design-Vorschau</h1>
    <p>Dieser Platzhalter wird in einem echten iframe geladen. Du kannst Fenster, Header, Rahmen und Icons unabhängig vom Chatbot testen.</p>
    <small>Die Chatoberfläche stammt im Produktivbetrieb aus der separaten Chatbot-Anwendung.</small>
  </main>
</body>
</html>
