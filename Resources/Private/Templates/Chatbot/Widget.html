<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="studi-assist-chatbot-root"
     data-chatbot-url="{settings.chatbotUrl}"
     data-study-program="{settings.studyProgram}"
     data-button-color="{f:if(condition: settings.buttonColor, then: settings.buttonColor, else: '#779EC4')}"
     data-button-color-end="{settings.buttonColorEnd}"
     data-text-color="{f:if(condition: settings.textColor, then: settings.textColor, else: '#ffffff')}"
     data-header-title="{f:if(condition: settings.headerTitle, then: settings.headerTitle, else: 'StudiAssist')}"
     data-icon-style="{settings.iconStyle}"
     data-status-dot-color="{settings.statusDotColor}"
     data-show-status-dot="{settings.showStatusDot}"
     data-window-background-color="{settings.windowBackgroundColor}"
     data-teaser-text="{settings.teaserText}"
     data-show-header="{settings.showHeader}"
     data-require-consent="{settings.requireConsent}"
     data-consent-text="{settings.consentText}"
     data-consent-text-en="{settings.consentTextEn}"
     data-privacy-policy-url="{settings.privacyPolicyUrl}">
</div>

</html>
